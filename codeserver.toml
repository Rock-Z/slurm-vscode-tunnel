root_dir = "~/Apps/slurm-vscode-tunnel/runs"
default_profile = "cpu"
code_bin = "code"
code_tunnel_args = ["tunnel"]

[env]
VSCODE_CLI_USE_FILE_KEYCHAIN = "1"
VSCODE_CLI_DISABLE_KEYCHAIN_ENCRYPT = "1"

[sidecars.paseo]
command = '''exec /gpfs/radev/home/ez275/Apps/npm/bin/paseo daemon start --foreground --home "$HOME/.paseo-slurm"'''
log = "paseo.log"
ready_command = '''/gpfs/radev/home/ez275/Apps/npm/bin/paseo daemon status --home "$HOME/.paseo-slurm"'''
ready_capture_command = '''/gpfs/radev/home/ez275/Apps/npm/bin/paseo daemon pair --json --home "$HOME/.paseo-slurm"'''
ready_output = "paseo-pairing.json"
ready_timeout = "2m"

[sidecars.paseo.env]
PATH = "/gpfs/radev/home/ez275/.local/node24/bin:/gpfs/radev/home/ez275/Apps/npm/bin:/apps/bin:/opt/slurm/current/bin:/usr/local/bin:/usr/bin:/bin"

[profiles.cpu]
enabled = true
sidecars = ["paseo"]
max_time = "24:00:00"
default_time = "24:00:00"
relay_overlap = "00:15:00"
relay_ready_timeout = "00:05:00"
relay_enabled = true
sbatch_args = [
  "--nodes=1",
  "--cpus-per-task=4",
  "--mem=32G",
  "--partition=day",
  "--job-name=codeserver-cpu",
]
pre_commands = []

[profiles.gpu]
enabled = true
max_time = "06:00:00"
default_time = "06:00:00"
relay_overlap = "00:10:00"
relay_ready_timeout = "00:05:00"
relay_enabled = true
sbatch_args = [
  "--nodes=1",
  "--cpus-per-task=4",
  "--mem=32G",
  "--partition=gpu_devel",
  "--gpus=1",
  "--job-name=codeserver-gpu",
]
pre_commands = []

[profiles.relay_test]
enabled = true
max_time = "00:02:00"
default_time = "00:02:00"
relay_overlap = "00:01:00"
relay_ready_timeout = "00:01:00"
relay_enabled = true
sbatch_args = [
  "--nodes=1",
  "--cpus-per-task=1",
  "--mem=1G",
  "--partition=day",
  "--job-name=codeserver-relay-test",
]
pre_commands = []

[profiles.cpu.env]
# EXAMPLE_VAR = "value"

[profiles.gpu.env]
# EXAMPLE_VAR = "value"

[profiles.relay_test.env]
