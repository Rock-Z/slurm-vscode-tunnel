root_dir = "~/Apps/slurm-vscode-tunnel/runs"
default_profile = "cpu"
code_bin = "code"
python_bin = "/usr/bin/python3"
code_tunnel_args = ["tunnel"]

[env]
VSCODE_CLI_USE_FILE_KEYCHAIN = "1"
VSCODE_CLI_DISABLE_KEYCHAIN_ENCRYPT = "1"

[sidecars.paseo_diagnostics]
command = '''
export PASEO_DIAGNOSTIC_DIR="/tmp/paseo-diagnostics-$UID-${SLURM_JOB_ID:?}"
exec /usr/bin/python3 /gpfs/radev/home/ez275/Apps/codeserver/paseo_diagnostics.py
'''
log = "paseo-diagnostics.log"

[sidecars.paseo]
command = '''
export PASEO_DIAGNOSTIC_DIR="/tmp/paseo-diagnostics-$UID-${SLURM_JOB_ID:?}"
exec /usr/bin/python3 /gpfs/radev/home/ez275/Apps/codeserver/paseo_runtime.py run --home "$HOME/.paseo-slurm"
'''
log = "paseo.log"
ready_command = '''exec /usr/bin/python3 /gpfs/radev/home/ez275/Apps/codeserver/paseo_ready.py "$HOME/.paseo-slurm"'''
# Allow packaging on GPFS as well as cached staging and daemon startup.
ready_timeout = "15m"

[profiles.cpu]
enabled = true
sidecars = ["paseo_diagnostics", "paseo"]
max_time = "168:00:00"
default_time = "168:00:00"
relay_overlap = "04:00:00"
relay_ready_timeout = "00:05:00"
relay_enabled = true
sbatch_args = [
  "--nodes=1",
  "--cpus-per-task=4",
  "--mem=32G",
  "--partition=week",
  "--job-name=codeserver-cpu",
]
pre_commands = []

[profiles.gpu]
enabled = true
max_time = "06:00:00"
default_time = "06:00:00"
relay_overlap = "00:10:00"
relay_ready_timeout = "00:05:00"
relay_enabled = true
sbatch_args = [
  "--nodes=1",
  "--cpus-per-task=4",
  "--mem=32G",
  "--partition=gpu_devel",
  "--gpus=1",
  "--job-name=codeserver-gpu",
]
pre_commands = []

[profiles.relay_test]
enabled = true
max_time = "00:02:00"
default_time = "00:02:00"
relay_overlap = "00:01:00"
relay_ready_timeout = "00:01:00"
relay_enabled = true
sbatch_args = [
  "--nodes=1",
  "--cpus-per-task=1",
  "--mem=1G",
  "--partition=day",
  "--job-name=codeserver-relay-test",
]
pre_commands = []

[profiles.cpu.env]
# EXAMPLE_VAR = "value"

[profiles.gpu.env]
# EXAMPLE_VAR = "value"

[profiles.relay_test.env]
# EXAMPLE_VAR = "value"
